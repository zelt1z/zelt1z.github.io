<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squad Builder</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>

<nav class="sidebar">
  <div class="side-brand">MC</div>
  <button id="navLineup" class="nav-btn active" data-tab="lineup">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.6"/><path d="M12 3v4M12 17v4M3 12h4M17 12h4"/></svg>
    <span>Lineup</span>
  </button>
  <button id="navStats" class="nav-btn" data-tab="stats">
    <svg viewBox="0 0 24 24"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
    <span>Stats</span>
  </button>
  <div class="sidebar-foot">
    <div class="foot-label">Man<br>City</div>
  </div>
</nav>

<div class="app">

  <header class="topbar">
    <div class="topbar-title">
      <h1>Squad Builder</h1>
      <p id="topbarSub">Build your matchday lineup</p>
    </div>
    <div class="topbar-actions" id="lineupControls1">
      <div class="field">
        <label>Team</label>
        <select id="logoSelect">
          <option value="logo.png">Manchester City</option>
          <option value="england.png">England</option>
        </select>
      </div>
      <div class="field">
        <label>Players</label>
        <select id="playerCount"></select>
      </div>
      <div class="field">
        <label>Formation</label>
        <select id="formationSelect"></select>
      </div>
      <button class="btn" id="freeModeBtn">Free mode: off</button>
      <button class="btn" id="drawToggleBtn">Draw: off</button>
      <button class="btn" id="clearDrawBtn">Clear ink</button>
      <button class="btn" id="clearBtn">Clear pitch</button>
    </div>
  </header>

  <div class="subbar" id="lineupControls2">
    <div class="topbar-actions">
      <div class="field">
        <label>Match</label>
        <input type="text" id="matchNameIn" value="Manchester City vs Opponent">
      </div>
      <div class="field">
        <label>Type</label>
        <input type="text" id="matchTypeIn" value="League Game">
      </div>
      <div class="field">
        <label>Time</label>
        <input type="text" id="matchTimeIn" value="8:00 PM UK TIME">
      </div>
    </div>
    <div class="topbar-actions">
      <div class="field">
        <label>Webhook</label>
        <input type="text" id="webhookUrl" placeholder="Paste Discord webhook URL...">
      </div>
    </div>
  </div>

  <main>

    <div class="view visible" id="lineupView">
      <div class="pitch-column">
        <div class="capture-area" id="captureArea">
          <div class="pitch-wrap" id="pitchWrap">
            <img src="logo.png" alt="Logo" class="pitch-watermark" id="pitchLogo">
            <div class="match-overlay">
              <div class="m-title" id="outName">Manchester City vs Opponent</div>
              <div class="m-type" id="outType">League Game</div>
              <div class="m-time" id="outTime">8:00 PM UK TIME</div>
            </div>
            <div class="manager-sig">Manager: Naseem</div>
            <svg class="pitch-lines" viewBox="0 0 300 400" preserveAspectRatio="none">
              <g>
                <rect x="0" y="0" width="300" height="40" fill="var(--pitch-1)" />
                <rect x="0" y="80" width="300" height="40" fill="var(--pitch-1)" />
                <rect x="0" y="160" width="300" height="40" fill="var(--pitch-1)" />
                <rect x="0" y="240" width="300" height="40" fill="var(--pitch-1)" />
                <rect x="0" y="320" width="300" height="40" fill="var(--pitch-1)" />
              </g>
              <rect x="4" y="4" width="292" height="392" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
              <line x1="4" y1="200" x2="296" y2="200" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
              <circle cx="150" cy="200" r="36" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
              <circle cx="150" cy="200" r="2" fill="rgba(255,255,255,0.55)"/>
              <rect x="70" y="4" width="160" height="55" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
              <rect x="110" y="4" width="80" height="22" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
              <path d="M 115 59 A 36 36 0 0 0 185 59" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
              <rect x="70" y="341" width="160" height="55" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
              <rect x="110" y="374" width="80" height="22" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
              <path d="M 115 341 A 36 36 0 0 1 185 341" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
              <path d="M 4 14 A 10 10 0 0 0 14 4" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
              <path d="M 286 4 A 10 10 0 0 0 296 14" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
              <path d="M 4 386 A 10 10 0 0 1 14 396" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
              <path d="M 296 386 A 10 10 0 0 1 286 396" fill="none" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
            </svg>
            <canvas id="drawingCanvas" width="720" height="750"></canvas>
            <div id="slotsLayer"></div>
          </div>

          <div class="bench-wrap" id="benchWrap">
            <div class="bench-title">Bench</div>
            <div class="bench-slots" id="benchSlotsLayer"></div>
          </div>
        </div>

        <div class="actions-row">
          <button class="btn primary" id="downloadBtn">Save image</button>
          <button class="btn discord" id="discordBtn">
            <svg viewBox="0 0 127.14 96.36" fill="#fff"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.51,80.21h0A105.73,105.73,0,0,0,32.79,96.36a77.7,77.7,0,0,0,6.89-11.1,77.42,77.42,0,0,1-11.07-5.22c.81-.62,1.61-1.25,2.37-1.92A74.45,74.45,0,0,0,63.57,85.22a74.19,74.19,0,0,0,32.55-7.1c.78.68,1.58,1.31,2.4,1.94a77.54,77.54,0,0,1-11.12,5.2,78.53,78.53,0,0,0,6.92,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96.2,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
            Send to Discord
          </button>
        </div>
      </div>

      <aside class="roster-panel" id="rosterPanelLineup"></aside>
    </div>

    <div class="view" id="statsView">
      <div class="stats-scroll" id="statsScroll"></div>
    </div>

  </main>
</div>

<!-- Roster panel template (cloned into each view) -->
<template id="rosterTemplate">
  <div class="roster-header">
    <h2>Roster</h2>
    <div class="roster-filter-row">
      <input type="text" class="roster-search" placeholder="Search players...">
      <select class="roster-pos-select">
        <option value="all">All</option>
        <option value="gk">GK</option>
        <option value="def">DEF</option>
        <option value="mid">MID</option>
        <option value="att">ATT</option>
      </select>
    </div>
    <div class="roster-team-tabs">
      <button class="rtt-btn active" data-team="all">All</button>
      <button class="rtt-btn" data-team="a">A Team</button>
      <button class="rtt-btn" data-team="asubs">Subs</button>
      <button class="rtt-btn" data-team="b">Academy</button>
    </div>
  </div>
  <div class="roster-list"></div>
  <div class="hint-bar"><b>Tip:</b> Click a player, then click a slot.</div>
</template>

<script src="app.js"></script>
</body>
</html>
